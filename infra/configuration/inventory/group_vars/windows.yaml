# WinRM connection into the folval3 guest (inventory is generated by
# `make inventory`, which fills ansible_host from the QEMU guest agent).
ansible_connection: winrm
ansible_port: 5985
ansible_user: vagrant
ansible_password: "{{ lookup('env', 'GUEST_WINRM_PASSWORD') }}"
ansible_winrm_transport: basic
ansible_winrm_server_cert_validation: ignore
ansible_winrm_operation_timeout_sec: 600
ansible_winrm_read_timeout_sec: 700

# Brain (workstation) LAN IP — gateway hosts-entry + staging source
brain_ip: "{{ lookup('env', 'LAB_BRAIN_IP') }}"
